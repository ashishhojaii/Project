<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusNav</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-size: 30px;
        }

        header p {
            margin-top: 7px;
            color: #cbd5e1;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .location {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .direction {
            text-align: center;
            font-size: 55px;
            margin: 25px 0 10px;
        }

        .distance {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .arrived {
            background: #dcfce7;
            color: #166534;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏫 CampusNav</h1>
    <p>Find your classroom easily</p>
</header>

<div class="container">

    <div class="card">

        <label for="destination">
            Select Destination
        </label>

        <select id="destination">

            <option value="room18">
                Room 18
            </option>

        </select>

        <button onclick="startNavigation()">
            🧭 Start Navigation
        </button>

        <div id="error"></div>

    </div>


    <div class="card">

        <h2>📍 Navigation</h2>

        <div class="location">

            <p>
                <strong>Your Location:</strong>
            </p>

            <p id="currentLocation">
                Waiting for GPS...
            </p>

            <br>

            <p>
                <strong>Destination:</strong>
            </p>

            <p>
                Room 18
            </p>

        </div>


        <div class="direction" id="direction">
            —
        </div>

        <div class="distance" id="distance">
            —
        </div>

        <div class="status" id="status">
            Waiting for navigation...
        </div>

        <div id="arrival"></div>

    </div>

</div>


<script>


// ==========================================
// DESTINATION
// ==========================================

const rooms = {

    room18: {
        name: "Room 18",

        lat: 26.786363,

        lng: 94.287180
    }

};


// ==========================================
// START NAVIGATION
// ==========================================

function startNavigation() {

    const selected =
        document.getElementById("destination").value;

    const destination =
        rooms[selected];


    if (!navigator.geolocation) {

        showError(
            "Your browser does not support GPS location."
        );

        return;
    }


    document.getElementById("status").innerText =
        "📡 Getting your location...";


    navigator.geolocation.watchPosition(

        function(position) {

            updateNavigation(
                position,
                destination
            );

        },

        function(error) {

            showError(
                "Unable to get your location. Please allow location permission."
            );

        },

        {

            enableHighAccuracy: true,

            maximumAge: 2000,

            timeout: 10000

        }

    );

}


// ==========================================
// UPDATE NAVIGATION
// ==========================================

function updateNavigation(position, destination) {


    const userLat =
        position.coords.latitude;

    const userLng =
        position.coords.longitude;


    const accuracy =
        position.coords.accuracy;


    // Show current location

    document.getElementById(
        "currentLocation"
    ).innerText =

        userLat.toFixed(6)
        + ", "
        + userLng.toFixed(6)
        + " ± "
        + Math.round(accuracy)
        + "m";


    // Calculate distance

    const distance =
        calculateDistance(

            userLat,
            userLng,

            destination.lat,
            destination.lng

        );


    // Calculate direction

    const bearing =
        calculateBearing(

            userLat,
            userLng,

            destination.lat,
            destination.lng

        );


    const direction =
        getDirection(bearing);


    // Display

    document.getElementById(
        "direction"
    ).innerText =
        direction.arrow;


    document.getElementById(
        "distance"
    ).innerText =
        formatDistance(distance);


    document.getElementById(
        "status"
    ).innerText =

        "Go "
        + direction.name
        + " toward Room 18";


    // ==========================================
    // ARRIVAL DETECTION
    // ==========================================

    if (distance <= 10) {

        document.getElementById(
            "arrival"
        ).innerHTML =

            '<div class="arrived">' +

            '🔔 You have arrived at Room 18! 🎉' +

            '</div>';

        document.getElementById(
            "status"
        ).innerText =
            "Destination reached.";

    }

    else {

        document.getElementById(
            "arrival"
        ).innerHTML =
            "";

    }

}


// ==========================================
// DISTANCE CALCULATION
// HAVERSINE FORMULA
// ==========================================

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const dLat =
        toRadians(lat2 - lat1);

    const dLon =
        toRadians(lon2 - lon1);


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


// ==========================================
// BEARING
// ==========================================

function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const φ1 =
        toRadians(lat1);

    const φ2 =
        toRadians(lat2);

    const Δλ =
        toRadians(lon2 - lon1);


    const y =
        Math.sin(Δλ) *
        Math.cos(φ2);


    const x =

        Math.cos(φ1) *
        Math.sin(φ2)

        -

        Math.sin(φ1) *
        Math.cos(φ2) *
        Math.cos(Δλ);


    let bearing =
        Math.atan2(y, x);


    bearing =
        bearing * 180 / Math.PI;


    return (
        bearing + 360
    ) % 360;

}


// ==========================================
// DIRECTION
// ==========================================

function getDirection(bearing) {


    if (
        bearing >= 337.5 ||
        bearing < 22.5
    ) {

        return {
            name: "North",
            arrow: "⬆️"
        };

    }


    if (bearing < 67.5) {

        return {
            name: "North-East",
            arrow: "↗️"
        };

    }


    if (bearing < 112.5) {

        return {
            name: "East",
            arrow: "➡️"
        };

    }


    if (bearing < 157.5) {

        return {
            name: "South-East",
            arrow: "↘️"
        };

    }


    if (bearing < 202.5) {

        return {
            name: "South",
            arrow: "⬇️"
        };

    }


    if (bearing < 247.5) {

        return {
            name: "South-West",
            arrow: "↙️"
        };

    }


    if (bearing < 292.5) {

        return {
            name: "West",
            arrow: "⬅️"
        };

    }


    return {
        name: "North-West",
        arrow: "↖️"
    };

}


// ==========================================
// FORMAT DISTANCE
// ==========================================

function formatDistance(distance) {

    if (distance < 1000) {

        return Math.round(distance) + " m";

    }

    return (
        distance / 1000
    ).toFixed(2) + " km";

}


// ==========================================
// RADIANS
// ==========================================

function toRadians(degrees) {

    return degrees *
        Math.PI / 180;

}


// ==========================================
// ERROR
// ==========================================

function showError(message) {

    document.getElementById(
        "error"
    ).innerHTML =

        '<div class="error">' +
        message +
        '</div>';

}

</script>

</body>
</html>
